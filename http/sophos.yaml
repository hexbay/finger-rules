# Sophos：主营网络与终端安全，代表产品包括防火墙、VPN、Web Appliance 和 Cyberoam。
- name: Sophos-Firewall
  matchers:
    - part: title
      type: word
      words:
        - Sophos
    - part: cert
      type: word
      words:
        - "CN=Sophos_CA"
- name: Sophos-Web-Appliance
  matchers:
    - part: icon_hash
      type: word
      words:
        - "-893681401"
- name: Sophos-Cyberoam-Appliance
  matchers:
    - part: cert
      type: word
      words:
        - "Cyberoam Appliance"
        - "CN=Appliance_Certificate"
- name: Sophos-VPN
  matchers-condition: and
  matchers:
    - part: title
      type: word
      words:
        - "VPN Portal"
    - part: icon_hash
      type: word
      words:
        - "1601194732"

- name: Sophos-Cyberoam-SSLVPN
  matchers:
    - part: title
      type: word
      words:
        - "Cyberoam SSL VPN Portal"

- matchers:
    - part: title
      words:
        - "Sophos Web Appliance"
        - "Sophos | Web Appliance"
      type: word
  name: Sophos-Web-Appliance

- name: unified-threat-management
  matchers:
    - part: title
      type: word
      words:
        - "Securepoint UTM"
- name: mobile
  vendor: sophos
  matchers:
    - part: title
      type: word
      words:
        - "sophos mobile"
# 三星（Samsung）：主营电子与智能设备，相关产品包括接入点、打印机、摄像机和录像设备。
- name: SAMSUNG-AP
  matchers:
    - type: word
      part: body
      name: "SAMSUNG-AP"
      words:
        - "<span>samsung ap manager</span>"
- matchers:
      - type: word
        part: title
        words:
          - "SyncThru Web Service"
  name: Samsung-Printer

- name: Samsung-AP
  matchers:
    - type: word
      part: title
      words:
        - "Samsung AP"
      condition: and
- name: Samsung-Network-Camera
  matchers:
    - type: word
      part: title
      words:
        - "SAMSUNG NETWORK CAMERA"
- name: Samsung-DVR
  matchers:
    - type: word
      part: title
      words:
        - "Samsung DVR"
- name: Samsung-NVR
  matchers:
    - type: word
      part: title
      words:
        - "SAMSUNG TECHWIN NVR Web Viewer"
        - "Web Viewer for Samsung NVR"
- name: Samsung-5G
  matchers:
    - type: word
      part: title
      words:
        - "Samsung 5G Station Admin Settings"

- name: MagicInfo-Premium-Server
  matchers:
    - type: word
      part: headers.server
      words:
        - "MagicInfo Premium Server"

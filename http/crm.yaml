# 产品类型：客户关系管理（CRM），包括销售、客户、营销和服务管理系统。
- name: 管家婆CRM
  matchers:
    - part: icon_hash
      type: word
      words:
          - "-79854140"
- name: 灵当CRM
  matchers:
    - part: icon_hash
      type: word
      words:
          - "436310201"
    - part: title
      type: word
      words:
          - "灵当CRM"
- matchers:
  - part: body
    type: word
    words:
      - "var module_sugar_grp1"
      - "Powered By SugarCRM"
      - "SugarCRM is a customer"
      - "SUGAR.ajaxUI.loadContent"
  name: sugarcrm


- matchers:

# 戴尔科技：主营服务器、存储与终端基础设施，代表产品包括 iDRAC、Unisphere 和 Wyse。
- name: iDRAC
  matchers:
    - part: title
      type: word
      words:
        - "Integrated Dell Remote Access Controller"
    - part: body
      type: word
      words:
        - "thisIDRACText"
- name: DELL-SonicWALL
  matchers:
    - part: title
      type: word
      words:
        - "DELL SonicWALL"
- name: Dell-Laser-printer
  matchers:
    - part: title
      type: word
      words:
        - 'Laser Printer'
- name: Dell-Unisphere
  matchers:
    - part: title
      type: word
      words:
        - "Unisphere"
- name: dell_emc_ecom
  vendor: dell
  matchers-condition: and
  matchers:
    - part: header
      type: word
      words:
        - "ECOMSecurity"
    - part: body
      type: word
      words:
        - "Welcome to ECOM"
- name: Dell-Wyse-Management-Suite
  matchers:
    - part: body
      type: word
      words:
        - "/ccm-web/"
        - "Wyse Management Suite"
# 泛微：主营协同办公与企业数字化，代表产品包括 e-cology、e-office、e-mobile 和 E-Weaver。
- name: e-cology
  matchers:
    - part: body
      type: word
      words:
        - '"/login/Login.jsp?logintype=1"'
        - '/wui/common/css/w7ovfont.css'
        - 'typeof poppedwindow'
        - 'client/jquery.client_wev8.js'
        - '/theme/ecology8/jquery/js/zdialog_wev8.js'
        - 'ecology8/lang/weaver_lang_7_wev8.js'
        - 'index_wev8.js'
        - 'jquery_wev8.js'

- name: e-mobile
  matchers:
    - part: body
      type: word
      words:
        - 'content="weaver e-mobile"'

- name: e-office
  matchers:
    - part: body
      type: word
      words:
        - /general/login/view//images/updateload.gif
- name: E-Weaver
  matchers:
    - part: body
      type: word
      words:
        - /weaver/weaver.file.MakeValidateCode

- name: e-bridge
  matchers:
    - part: body
      type: word
      words:
        - '<meta name="searchtitle" content="泛微云桥e-Bridge"> '
- name: e-office
  matchers:
    - part: body
      type: word
      words:
        - '/eoffice/client/web/'

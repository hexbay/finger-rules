# 产品类型：打印机与打印管理设备，包括办公打印机及其 Web 管理界面。
- name: Sharp-Printer
  matchers:
    - part: header
      type: word
      words:
        - 'MFPSESSIONID='
- name: Lexmark-Printer
  matchers:
    - part: header
      type: word
      words:
        - 'lexmark_web_server'
- name: Brother-Printer
  matchers:
    - part: title
      type: word
      words:
        - 'Brother MFC'
- name: AMR-Printer
  matchers:
    - part: title
      type: word
      words:
        - 'AMR Printer Management'
- name: Sato
  matchers:
    - part: title
      type: word
      words:
        - 'Sato'
- name: topaccess
  vendor: toshiba
  matchers:
    - part: title
      type: word
      words:
        - 'topaccess'

- name: HL-L8260CDN
  matchers:
    - part: title
      type: word
      words:
        - 'Brother HL-L8260CDN'

- name: Web Image Monitor
  matchers:
    - part: title
      type: word
      words:
        - "Web Image Monitor"

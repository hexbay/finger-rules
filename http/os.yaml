# 产品类型：操作系统识别，包括 Linux 发行版及其系统特征。

- name: Linux
  matchers:
    - part: headers.server
      type: regex
      name: version
      regex:
        - Linux\/([\d\.\w-]+)
    - part: headers.server
      type: word
      words:
        - linux
- matchers:
    - part: headers.server
      type: word
      words:
        - ubuntu
    - part: headers.x-powered-by
      type: word
      words:
        - ubuntu
  name: Ubuntu

# 技术类型：PHP 语言及应用生态，包括 PHP 运行环境、框架、开发套件和 CMS。
- name: PHP
  matchers:
    - part: title
      type: word
      words:
        - PHP
    - part: headers.x-powered-by
      type: regex
      name: version
      regex:
        - "PHP/(.+)"
    - name: version
      part: headers.server
      regex:
        - PHP/(:?([^\s^\r^\n]+))
      type: regex
    - part: headers.set-cookie
      type: word
      words:
        - PHPSESSID
- matchers:
    - part: headers.Set-Cookie
      type: word
      words:
        - laravel_session
  name: Laravel
- name: OURPHP
  matchers:
    - part: body
      type: word
      words:
        - content="OURPHP"
- name: XAMPP
  matchers:
    - part: title
      type: word
      words:
        - "XAMPP"

- name: ThinkCMF
  matchers:
    - part: headers.x-powered-by
      type: word
      words:
        - ThinkCMF
    - part: body
      type: word
      words:
        - content="ThinkCMF
        - made by <a href="http://www.thinkcmf.com" target="_blank">thinkcmf</a>
- name: ThinkPHP
  matchers:
    - part: headers.x-powered-by
      type: word
      words:
        - ThinkPHP
    - part: body
      type: word
      words:
        - ef="http://www.thinkphp.cn">thinkphp</a><sup>
    - part: headers.Set-Cookie
      type: word
      words:
        - thinkphp_show_page_trace
        - think_language

- name: DolphinPHP
  matchers:
    - part: title
      type: word
      words:
        - DolphinPHP
- name: PHP-Mailer
  matchers:
    - part: title
      type: word
      words:
        - "PHP Mailer"

- matchers:
  - part: body
    type: word
    words:
      - phpLDAPadmin
  name: phpldapadmin


- matchers:
  - part: body
    type: word
    words:
    - phpsysinfo
  name: phpsysinfo

- name: PHPnow
  matchers:
    - part: body
      type: word
      words:
        - "PHPnow works"

- name: php_spx
  vendor: noisebynorthwest
  matchers-condition: and
  matchers:
    - part: title
      type: word
      words:
        - "SPX Control Panel"
    - part: body
      type: word
      words:
        - "SPX_ENABLED"

- name: user_registration_login_and_user_management_system
  vendor: phpgurukul
  matchers:
    - part: title
      type: word
      words:
        - "Registration and Login System"
- name: phpjabbers-event-booking-calendar
  matchers:
    - part: body
      type: word
      condition: and
      words:
        - "Event Booking Calendar"
        - "PHPJabbers"
    - part: body
      type: word
      words:
        - "/event-booking-calendar/"

- name: cakephp
  vendor: cakephp
  matchers:
    - part: header
      type: word
      words:
        - "CAKEPHP"

- name: php_cs_fixer
  matchers:
    - part: body
      type: word
      words:
        - "php_cs.cache"

- name: phalcon
  matchers:
    - part: body
      type: word
      words:
        - "Phalcon Framework"

- matchers:
  - part: title
    type: word
    words:
      - "phpMyFAQ"
  name: phpmyfaq

- matchers:
  - part: header
    type: word
    words:
      - phpvms
  name: phpVMS
# SonicWall：主营网络安全，代表产品包括防火墙、SMA 和安全分析平台。
- name: SonicWall
  matchers:
    - part: title
      type: word
      words:
        - "SonicWall - Authentication"
        - "SonicWall Network Security"
    - part: headers.server
      words:
        - SonicWALL
      type: word
- matchers:
    - part: headers.server
      words:
        - SonicWALL SSL-VPN Web Server
      type: word
  vendor: SonicWall
  name: SSLVPN
- matchers:
  - part: headers.server
    words:
      - SonicWALL
    type: word
  name: sonicwall_firewall
- matchers:
  - part: body
    type: word
    words:
      - images/gray_waves.back.gif
      - "SonicWALL Universal Management Suite"
      - "SonicWALL Global Management System"
  name: sonicwall_gms
- name: email_security
  matchers:
    - part: body
      type: word
      words:
        - "SonicWALL Email Security"
- name: sonicos
  vendor: sonicwall
  matchers:
    - part: body
      type: word
      words:
        - "SonicOS"

- name: analytics
  matchers:
    - part: icon_hash
      type: word
      words:
        - "-1381126564"

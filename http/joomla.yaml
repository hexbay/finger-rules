# Joomla：主营开源内容管理系统，代表产品为 Joomla CMS 及其扩展。
- name: forms
  vendor: balbooa
  matchers:
    - part: body
      type: word
      words:
        - "com_baforms"

- matchers:
    - part: body
      type: word
      words:
        - 'Joomla! - Copyright'
        - "/media/system/js/core.js"
        - "/media/system/js/mootools-core.js"
  name: joomla

- name: Page Builder CK
  vendor: Cédric KEIFLIN
  matchers:
    - part: body
      type: word
      words:
        - 'com_pagebuilderck'
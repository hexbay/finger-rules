# 居易科技（DrayTek）：主营企业网络设备，代表产品包括 Vigor 路由器和 VigorConnect。
- name: DrayTek-Vigor-Router
  matchers:
    - part: cert
      type: word
      condition: and
      words:
          - "CN=Vigor Router"
          - "OU=DrayTek Support"
    - part: title
      type: word
      words:
        - "Vigor"
- name: VigorConnect
  matchers:
    - part: title
      type: word
      words:
        - "VigorConnect"
# Google：主营互联网与云计算服务，相关产品包括 Google Cloud、Analytics、Web Server 和 Earth。
- matchers:
    - part: body
      type: word
      words:
        - google-analytics.com/ga.js
        - google-analytics.com/analytics.js
  name: Google-Analytics
- matchers:
    - part: headers.server
      type: word
      words:
        - Google Web Server
  name: Google-Web-Server
- name: Google-Earth
  matchers:
    - part: title
      type: word
      words:
        - GEE Server
- name: Google-Cloud
  matchers:
    - part: headers.server
      type: word
      words:
        - Google Cloud
- name: google_a2a
  vendor: Google
  matchers:
    - part: body
      type: word
      condition: and
      words:
        - '"skills"'
        - '"capabilities"'
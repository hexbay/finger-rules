# 产品类型：内容分发网络（CDN）与云加速，包括边缘缓存、流量加速和机器人防护服务。
- name: CloudFlare
  matchers:
    - type: word
      part: header

      words:
        - "cloudflare-nginx"
        - "__cfduid="
        - "cf-ray:"
    - type: word
      part: cert
      words:
        - "OU=CloudFlare Origin CA"
- matchers:
    - part: headers.Set-Cookie
      type: word
      words:
        - __cf_bm
  name: CloudFlare-Bot-Management

- name: 加速乐
  matchers:
    - part: headers.Set-Cookie
      type: word
      words:
        - "__jsluid_"
    - part: header
      type: word
      words:
        - "X-Via-JSL"

- name: Alibaba-Web-WAF
  matchers:
    - part: title
      type: word
      words:
        - 阿里云 Web应用防火墙
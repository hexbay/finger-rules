# 产品类型：Web 与应用开发框架，包括后端框架、前端框架及其调试组件。
- name: ZK-framework
  matchers:
    - part: title
      type: word
      words:
        - "Server backup manager"
- name: dash
  vendor: plotly
  matchers:
    - part: body
      type: word
      condition: or
      words:
        - "dash-core-components"
        - "_dash-component-suites"
- name: qwik
  matchers:
    - part: body
      type: word
      words:
        - "q:container"
        - "q:version"
      condition: or
- name: laravel_ignition
  vendor: spatie
  matchers:
    - part: body
      type: word
      words:
        - "/_ignition/"
        - "Ignition"
      condition: and

- name: SpringBoot
  matchers:
    - part: 'body'
      type: word
      words:
        - '"message":"No message available",'
        - 'Whitelabel Error Page'

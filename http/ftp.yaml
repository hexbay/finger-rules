# 产品类型：FTP 文件传输服务，包括 FTP 服务器、客户端和 Web 管理界面。
- matchers:
    - part: body
      type: word
      words:
        - "220 Microsoft FTP Service"
  service: ftp
  name: Microsoft-FTP-Service

- matchers:
    - part: body
      type: word
      words:
        - "vsFTPd"
  service: ftp
  name: vsFTPd
- name: Pure-FTPd
  matchers:
    - part: body
      type: word
      words:
        - "Welcome to Pure-FTPd"
  service: ftp

- name: filezilla_server
  matchers:
    - part: body
      type: word
      words:
        - "FileZilla Server version"
  service: ftp

- name: Titan FTP Server
  matchers:
    - part: body
      type: word
      words:
        - "Titan FTP Server"
  service: ftp

- name: filezilla_client
  vendor: filezilla_project
  matchers:
    - part: body
      type: word
      condition: and
      words:
        - "<filezilla>"
        - "<User>"
  service: ftp
- name: FileZilla-Client
  vendor: filezilla-project
  matchers:
    - part: body
      type: word
      condition: and
      words:
        - "<filezilla"
        - "<User>"
        - "<Pass>"
        - "<Logontype>"

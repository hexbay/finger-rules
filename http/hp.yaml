# 惠普（HP）：主营计算与办公设备，相关产品包括交换机、打印机和系统诊断工具。
- name: HP-Switch
  matchers:
    - name: mode
      type: regex
      part: title
      regex:
        - "HP (.+) Switch"
- name: HP-Printer
  matchers:
    - type: word
      part: body
      condition: and
      words:
        - Printer Cartridges
        - /hp/device/contentHeader.html
- name: linuxki
  matchers:
    - part: body
      type: word
      words:
        - /linuxki/
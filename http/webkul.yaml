# Webkul：主营电商扩展与企业 Web 应用，相关产品包括 UVdesk 和 QloApps。
- name: uvdesk
  matchers:
    - part: title
      type: word
      words:
        - "UVDesk Helpdesk Community Edition - Installation Wizard"

- name: QloApps
  matchers:
    - part: title
      type: word
      words:
        - "QloApps"

- name: bagisto
  vendor: webkul
  matchers:
    - part: body
      type: word
      words:
        - 'Bagisto'

- name: Krayin CRM
  vendor: webkul
  matchers:
    - part: title
      type: word
      words:
        - "Krayin"

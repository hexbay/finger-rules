# 技术类型：Java 与 JSP，用于识别 Java 运行环境和服务器端页面技术。
- name: Java
  matchers:
    - part: headers.server
      type: regex
      name: version
      regex:
        - java/([\d\.\w-]+)
    - part: header
      type: word
      words:
        - "jsessionid"
        
- name: JSP
  matchers:
    - part: headers.x-powered-by
      type: regex
      name: version
      regex:
        - JSP(?:\/([\d\.]+))
# 佳能（Canon）：主营影像与办公设备，相关产品包括网络摄像机、打印服务器和 imageRUNNER。

- name: Canon Camera
  matchers:
    - part: body
      type: word
      condition: and
      words:
        - canon
        - "<title>Network Camera</title>"
- matchers:
    - part: headers.server
      words:
        - CANON HTTP Server
      type: word
  name: Canon-Print-Server
- name: imageRUNNER
  matchers:
    - part: headers.server
      type: word
      words:
        - "imageRUNNER"
- name: c3325
  matchers:
    - part: title
      type: word
      words:
        - "c3325"
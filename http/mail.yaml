# 产品类型：邮件与 WebMail 系统，包括邮件服务器、客户端和协作平台。
- name: Mail-Server
  matchers:
    - part: title
      type: word
      words:
        - "IceWARP"
    - part: headers.server
      words:
        - IceWarp
      type: word
    - name: version
      part: headers.server
      regex:
        - ^IceWarp\/(.+)$
      type: regex

- matchers:
  - part: title
    type: word
    words:
      - "SmarterMail"
  name: SmarterMail

- name: getresponse
  matchers:
    - part: body
      type: word
      words:
        - "With GetResponse Landing Pages, lead generation has never been easier"

- name: mailinspector
  vendor: hsc
  matchers:
    - part: body
      type: word
      words:
        - "Licensed to HSC TREINAMENTO"

- name: proxmox_mail_gateway
  vendor: proxmox
  matchers:
    - part: body
      type: word
      words:
        - "Proxmox = {"

- name: raidenmaild
  vendor: raidenmaild
  matchers:
    - part: body
      type: word
      words:
        - "RaidenMAILD"

- name: smtp4dev
  vendor: rnwood
  matchers:
    - part: title
      type: word
      words:
        - "smtp4dev"

- name: WebMail
  matchers:
    - part: title
      type: word
      words:
        - "Roundcube Webmail"
    - part: icon_hash
      type: word
      words:
        - "-1203843035"
    - part: headers.set-cookie
      type: word
      words:
        - roundcube_cookies

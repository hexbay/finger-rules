# 产品类型：网络存储（NAS），包括存储设备、文件共享和管理平台。
- name: Vaswani-NAS
  matchers:
  - part: title
    type: word
    condition: and
    words:
    - Vaswani NAS
- name: Wisegiga-NAS
  matchers:
  - part: icon_hash
    type: word
    words:
    - '175710103'
- name: ZimaOS
  matchers:
  - part: header
    type: word
    words:
    - ZimaOS-Gateway
- name: CasaOS
  matchers:
  - part: title
    type: word
    words:
    - CasaOS
  - part: body
    type: word
    words:
    - /CasaOS-UI/public/index.html
- name: Seagate-NAS
  matchers:
  - part: title
    type: word
    words:
    - Seagate-NAS
- name: 飞牛-NAS
  matchers:
  - part: icon_hash
    type: word
    words:
    - '470295793'
  - part: title
    type: word
    words:
    - 飞牛
- name: QNAP-NAS
  vendor: qnap
  matchers:
  - part: title
    type: word
    words:
    - QNAP Turbo NAS
    condition: or
  - part: icon_hash
    type: word
    words:
    - '123456789'
    condition: or
  matchers-condition: and

- name: headlamp
  matchers:
    - part: body
      type: word
      words:
        - "Headlamp: Kubernetes Web UI"
        - "headlampBaseUrl"
- name: Chroma DB
  matchers:
    - part: body
      type: word
      words:
        - 'ChromaDB'

- name: Terramaster-TOS
  matchers:
    - part: title
      type: word
      words:
        - "TOS Loading"

# 群晖（Synology）：主营网络存储与私有云，代表产品包括 DiskStation、RackStation、NVR 和 DSM。
- name: Synology-DiskStation
  matchers:
    - part: title
      type: word
      condition: and
      words:
        - Synology
        - DiskStation

    - part: body
      type: word
      words:
        - "synoSDSjslib/sds.css"
- name: Synology-NVR
  matchers:
    - part: title
      type: regex
      name: mode
      regex:
        - (.*) - Synology NVR
- name: Synology-RackStation
  matchers:
    - part: title
      type: word
      words:
        - "Synology RackStation"
- name: Synology-WebStation
  matchers:
    - part: title
      type: word
      words:
        - "Synology Web Station"
        - "Synology Web Station"
- name: Synology-Web-Assistant
  matchers:
    - part: title
      type: word
      words:
        - "Synology Web Assistant"
- name: Synology-VirtualDSM
  matchers:
    - part: title
      type: regex
      name: mode
      regex:
        - "(.*) - Synology VirtualDSM"
- name: Synology-Redirect-CGI
  matchers:
    - part: title
      type: word
      words:
        - "Synology Redirect CGI"
- name: Synology-Ikoula
  matchers:
    - part: title
      type: word
      words:
        - "Ikoula Synology"
- name: Synology-NAS
  matchers:
    - part: title
      type: word
      condition: and
      words:
        - "NAS"
        - "Synology"
- name: Synology-Router-Manager
  matchers:
    - part: body
      type: word
      words:
        - '"hostname" : "SynologyRouter"'
- name: photos
  matchers:
    - part: body
      type: word
      words:
        - "BeeStation"

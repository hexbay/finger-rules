# 技术类型：Python Web 与数据应用，包括 Uvicorn、Tornado、Jupyter 和常见 Python 服务框架。
- matchers:
  - part: headers.server
    type: word
    words:
    - uvicorn
  name: uvicorn
- matchers:
    - group: 1
      name: version
      part: headers.server
      regex:
        - Python(?:/([\d.]+))?
      type: regex
  name: python
- name: adk_python
  vendor: google
  matchers-condition: and
  matchers:
    - type: word
      part: header
      words:
        - "uvicorn"
    - type: word
      part: title
      words:
        - "ADK"
- name: Tornado
  matchers:
  - part: headers.server
    type: regex
    name: version
    regex:
        - TornadoServer\/([\d.]+)
- name: Notebook
  matchers:
    - type: word
      part: title
      words:
        - Jupyter Notebook
- name: aiohttp
  matchers:
    - type: regex
      name: version
      part: headers.server
      regex:
          - aiohttp(?:/([\d.]+))?
- matchers:
    - part: headers.set-cookie
      words:
        - csrftoken
        - django_language
      type: word
  name: Django
- matchers:
    - part: body
      type: word
      words:
        - <meta name="generator" content="Odoo"/>
    - part: title
      type: word
      words:
        - Odoo
  name: Odoo
- name: flower
  matchers:
    - type: word
      part: icon_hash
      words:
        - "-374133142"
- name: PySpider
  matchers:
    - type: word
      part: title
      words:
          - Dashboard - pyspider
- name: Tautulli
  matchers:
    - type: word
      part: title
      words:
        - Tautulli
- name: Supervisor
  matchers:
    - type: word
      part: title
      words:
        - "Supervisor Status"
- name: gradio
  matchers:
    - type: word
      part: title
      words:
        - gradio
    - type: word
      part: body
      words:
        - "__gradio_mode__"
- name: framework
  matchers:
    - part: body
      type: word
      words:
        - "Laravel-Framework"
        - "Laravel Framework"
- name: QdrantUI
  matchers:
    - type: word
      part: body
      words:
        - "qdrant - vector search engine"
- name: PostgREST
  matchers:
    - type: word
      part: headers.server
      words:
        - "PostgREST"
- name: pyramid_debugtoolbar
  vendor: pylons
  matchers-condition: and
  matchers:
    - type: word
      part: title
      words:
        - "Pyramid Debug Toolbar"
    - type: word
      part: body
      words:
        - "Pyramid DebugToolbar</a>"
- name: solara
  vendor: widgetti
  matchers:
    - type: word
      part: icon_hash
      words:
        - "-223126228"
- name: gpt_academic
  vendor: binary_husky
  matchers:
    - type: word
      part: body
      condition: or
      words:
        - "gpt_academic"
        - "gptacademic"
- name: starlette
  vendor: kludex
  matchers:
    - type: word
      part: body
      words:
        - "starlette"

# 阿里巴巴：主营云计算与企业数字化，相关产品包括 AnyProxy、Canal 和 Sentinel。
- name: AnyProxy
  matchers:
    - type: word
      part: body
      words:
        - "anyproxy"

- name: Canal-Admin
  matchers:
    - part: title
      type: word
      words:
        - "Canal Admin"

- name: sentinel
  matchers:
    - part: title
      type: word
      words:
        - "sentinel dashboard"

- name: Nacos
  matchers:
    - part: title
      type: word
      words:
        - Nacos

- name: Tengine
  matchers:
    - part: headers.server
      words:
        - Tengine
      type: word

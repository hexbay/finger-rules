# Akamai：主营 CDN、云计算与网络安全，相关产品包括 CloudTest 和云端应用交付服务。
- name: CloudTest
  matchers:
    - part: body
      type: word
      words: 
        - 'Akamai CloudTest'

- name: akamai
  matchers:
    - type: word
      part: headers.pragma
      words:
        - "akamai-x-cache-on"
        - "akamai-x-cache-remote"

- matchers:
    - part: headers.server
      words:
        - AkamaiGHost
      type: word
  name: Akamai-CDN

- matchers:
    - part: headers.server
      words:
        - AkamaiGHost
      type: word
  name: Akamai-Kona-Site-Defender

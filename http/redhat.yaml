# 红帽（Red Hat）：主营企业开源与云原生平台，代表产品包括 OpenShift 和 Keycloak。
- name: OpenShift
  vendor: redhat
  matchers:
    - part: title
      type: word
      words:
        - 'OpenShift'

- name: keycloak
  matchers:
    - part: title
      type: word
      words:
        - "keycloak"
    - part: icon_hash
      type: word
      words:
        - "-1105083093"

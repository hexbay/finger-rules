# FIT2CLOUD：主营云原生与基础设施管理，代表产品包括 1Panel、KubePi 和 KubeOperator。
- name: KubePi
  matchers:
    - type: word
      part: title
      words:
        - KubePi

- name: 1Panel
  matchers:
    - part: icon_hash
      type: word
      words:
        - "1300107149"
    - part: body
      type: word
      condition: and
      words:
        - "first-loading-wrap"
        - "loading..."

- name: kubeoperator
  matchers:
    - part: body
      type: word
      words:
        - "kubeoperator"

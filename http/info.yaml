# 检测类型：通用组件、目录列表、登录页及可能的信息泄露特征。
- name: Directory Listing
  matchers:
    - part: body
      type: word
      words:
        - "Directory Listing For"
- matchers:
    - part: body
      type: word
      words:
        - <title>Index of /
  name: Index-Of
- name: Login
  matchers:
    - part: title
      type: word
      words:
        - "登录"
- name: 色情网站
  matchers:
    - part: title
      type: word
      words:
        - "国产极品视频"
        - "新葡的京集团"
        - "成人精品"
    - part: title
      type: word
      condition: and
      words:
        - "国产"
        - "成"
